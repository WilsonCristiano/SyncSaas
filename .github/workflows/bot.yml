name: syncsaas-bot
on:
  repository_dispatch:
    types: [new-posts, scrape]   # new-posts: aprovação/retry (só publica) | scrape: botão "Executar scraping agora"
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"          # a cada hora: lê fontes vencidas e publica se a janela anti-spam permitir
concurrency:
  group: syncsaas-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      CAPTION_TEMPLATE: ${{ vars.CAPTION_TEMPLATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: bot/requirements.txt }
      - run: pip install -r bot/requirements.txt

      # 1) Scraping (se aplicável) + verificação barata: há algo publicável agora?
      - id: chk
        run: |
          ARGS="--scrape"
          if [ "${{ github.event.action }}" = "scrape" ]; then ARGS="--scrape --force"; fi
          if [ "${{ github.event.action }}" = "new-posts" ]; then ARGS=""; fi
          python -m bot.main $ARGS --check

      # 2) Só instala o Chromium e publica quando necessário
      - if: steps.chk.outputs.eligible == 'true'
        run: playwright install --with-deps chromium
      - if: steps.chk.outputs.eligible == 'true'
        run: python -m bot.main
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
